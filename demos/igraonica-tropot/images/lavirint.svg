<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640" role="img">

  <rect width="800" height="640" fill="#F3E6D6"/>
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#3A2C28" flood-opacity=".14"/></filter>
  </defs>
  <rect x="80" y="70" width="640" height="500" rx="32" fill="#2F6F6A" filter="url(#s)"/>
  <rect x="110" y="100" width="580" height="440" rx="24" fill="#3E8A83"/>
  <!-- maze walls -->
  <g fill="#1F4F4B">
    <rect x="140" y="140" width="200" height="36" rx="12"/>
    <rect x="140" y="140" width="36" height="200" rx="12"/>
    <rect x="250" y="240" width="200" height="36" rx="12"/>
    <rect x="414" y="140" width="36" height="220" rx="12"/>
    <rect x="500" y="140" width="160" height="36" rx="12"/>
    <rect x="624" y="140" width="36" height="260" rx="12"/>
    <rect x="140" y="400" width="280" height="36" rx="12"/>
    <rect x="500" y="360" width="36" height="180" rx="12"/>
    <rect x="300" y="300" width="36" height="140" rx="12"/>
    <rect x="360" y="470" width="240" height="36" rx="12"/>
  </g>
  <!-- entry / exit -->
  <rect x="140" y="500" width="70" height="20" rx="8" fill="#F0D48A"/>
  <rect x="590" y="500" width="70" height="20" rx="8" fill="#F0B49A"/>
  <!-- climbing holds -->
  <circle cx="200" cy="230" r="14" fill="#F0D48A"/>
  <circle cx="230" cy="300" r="14" fill="#E8B4C4"/>
  <circle cx="560" cy="230" r="14" fill="#E8876C"/>
  <circle cx="200" cy="360" r="14" fill="#B5D4D6"/>
  <circle cx="380" cy="200" r="14" fill="#F2C14E"/>
  <circle cx="580" cy="320" r="14" fill="#8FBEB0"/>

</svg>
