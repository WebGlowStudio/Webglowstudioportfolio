<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img">

  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F1"/>
      <stop offset="100%" stop-color="#F6E9DA"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D2B8"/>
      <stop offset="100%" stop-color="#D9C0A4"/>
    </linearGradient>
    <linearGradient id="skywin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9FD0E0"/>
      <stop offset="100%" stop-color="#D8EEF0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A2C28" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#wall)"/>
  <!-- floor -->
  <path d="M0 620 L1200 620 L1200 900 L0 900 Z" fill="url(#floor)"/>
  <path d="M0 620 L1200 620" stroke="#C9B094" stroke-width="3"/>
  <!-- soft floor mat stripes -->
  <rect x="40" y="680" width="1120" height="180" rx="20" fill="#F4E4D0" opacity=".7"/>
  <g opacity=".35">
    <circle cx="160" cy="770" r="18" fill="#F0B49A"/>
    <circle cx="220" cy="770" r="18" fill="#F0D48A"/>
    <circle cx="280" cy="770" r="18" fill="#B5D4D6"/>
    <circle cx="190" cy="820" r="18" fill="#8FBEB0"/>
    <circle cx="250" cy="820" r="18" fill="#E8B4C4"/>
  </g>

  <!-- window -->
  <g filter="url(#soft)">
    <rect x="70" y="80" width="280" height="260" rx="18" fill="#F4E6D4" stroke="#E0C8B0" stroke-width="8"/>
    <rect x="86" y="96" width="248" height="228" rx="10" fill="url(#skywin)"/>
    <line x1="210" y1="96" x2="210" y2="324" stroke="#F4E6D4" stroke-width="8"/>
    <line x1="86" y1="210" x2="334" y2="210" stroke="#F4E6D4" stroke-width="8"/>
    <circle cx="150" cy="150" r="28" fill="#F7D56A"/>
    <circle cx="150" cy="150" r="18" fill="#FBE38A"/>
  </g>
  <!-- plant under window -->
  <g>
    <rect x="160" y="540" width="70" height="80" rx="8" fill="#B5523C"/>
    <rect x="170" y="530" width="50" height="14" rx="4" fill="#9A4230"/>
    <ellipse cx="195" cy="500" rx="36" ry="50" fill="#2F6F6A"/>
    <ellipse cx="170" cy="510" rx="22" ry="36" fill="#3E8A83"/>
    <ellipse cx="220" cy="515" rx="20" ry="32" fill="#3E8A83"/>
  </g>

  <!-- paper garland -->
  <path d="M40 40 Q300 90 600 40 T1160 50" fill="none" stroke="#C9B094" stroke-width="3"/>
  <g>
    <polygon points="120,48 140,48 130,78" fill="#E8876C"/>
    <polygon points="220,62 240,62 230,92" fill="#F0D48A"/>
    <polygon points="330,52 350,52 340,82" fill="#3E8A83"/>
    <polygon points="450,68 470,68 460,98" fill="#E8B4C4"/>
    <polygon points="560,46 580,46 570,76" fill="#7EB0C8"/>
    <polygon points="680,62 700,62 690,92" fill="#E8876C"/>
    <polygon points="800,48 820,48 810,78" fill="#8FBEB0"/>
    <polygon points="920,64 940,64 930,94" fill="#F2C14E"/>
    <polygon points="1040,50 1060,50 1050,80" fill="#F0B49A"/>
  </g>

  <!-- play structure / labyrinth -->
  <g filter="url(#soft)">
    <!-- base platform -->
    <rect x="520" y="360" width="520" height="280" rx="28" fill="#2F6F6A"/>
    <rect x="540" y="380" width="480" height="200" rx="20" fill="#3E8A83"/>
    <!-- tunnels -->
    <rect x="560" y="420" width="120" height="90" rx="20" fill="#245954"/>
    <rect x="710" y="400" width="130" height="110" rx="22" fill="#1F4F4B"/>
    <rect x="870" y="430" width="120" height="80" rx="20" fill="#245954"/>
    <!-- top deck -->
    <rect x="620" y="250" width="260" height="130" rx="18" fill="#B5523C"/>
    <rect x="640" y="268" width="220" height="70" rx="12" fill="#E8876C"/>
    <!-- rails -->
    <rect x="628" y="246" width="12" height="120" rx="4" fill="#9A4230"/>
    <rect x="860" y="246" width="12" height="120" rx="4" fill="#9A4230"/>
    <rect x="628" y="246" width="244" height="10" rx="4" fill="#9A4230"/>
    <!-- slide -->
    <path d="M880 280 C 1040 300, 1080 430, 1060 620" fill="none" stroke="#F0D48A" stroke-width="42" stroke-linecap="round"/>
    <path d="M880 280 C 1040 300, 1080 430, 1060 620" fill="none" stroke="#F7E3A8" stroke-width="22" stroke-linecap="round"/>
    <!-- climbing dots -->
    <circle cx="600" cy="500" r="10" fill="#F0D48A"/>
    <circle cx="660" cy="530" r="10" fill="#F0B49A"/>
    <circle cx="820" cy="510" r="10" fill="#E8B4C4"/>
    <circle cx="780" cy="545" r="10" fill="#B5D4D6"/>
  </g>

  <!-- ball pit -->
  <g filter="url(#soft)">
    <ellipse cx="360" cy="700" rx="210" ry="70" fill="#B5523C"/>
    <ellipse cx="360" cy="686" rx="198" ry="58" fill="#C45C3E"/>
    <!-- balls -->
    <g>
      <circle cx="250" cy="670" r="22" fill="#F0D48A"/>
      <circle cx="290" cy="655" r="20" fill="#B5D4D6"/>
      <circle cx="330" cy="668" r="24" fill="#8FBEB0"/>
      <circle cx="370" cy="650" r="21" fill="#E8B4C4"/>
      <circle cx="410" cy="666" r="23" fill="#F2C14E"/>
      <circle cx="450" cy="655" r="20" fill="#3E8A83"/>
      <circle cx="270" cy="700" r="22" fill="#E8876C"/>
      <circle cx="315" cy="705" r="20" fill="#7EB0C8"/>
      <circle cx="360" cy="698" r="22" fill="#F0B49A"/>
      <circle cx="405" cy="708" r="21" fill="#7BA87A"/>
      <circle cx="448" cy="698" r="19" fill="#F0D48A"/>
      <circle cx="230" cy="698" r="18" fill="#E8B4C4"/>
      <circle cx="490" cy="688" r="18" fill="#B5D4D6"/>
      <!-- highlights -->
      <circle cx="244" cy="662" r="6" fill="#fff" opacity=".45"/>
      <circle cx="324" cy="660" r="6" fill="#fff" opacity=".45"/>
      <circle cx="364" cy="642" r="6" fill="#fff" opacity=".45"/>
      <circle cx="404" cy="658" r="6" fill="#fff" opacity=".45"/>
    </g>
  </g>

  <!-- small table / cake hint -->
  <g>
    <ellipse cx="160" cy="660" rx="46" ry="12" fill="#C9B094"/>
    <rect x="118" y="620" width="84" height="42" rx="6" fill="#F4E6D4"/>
    <rect x="140" y="598" width="40" height="28" rx="6" fill="#E8B4C4"/>
    <rect x="148" y="590" width="24" height="12" rx="4" fill="#FFF8F1"/>
    <circle cx="160" cy="586" r="5" fill="#E8876C"/>
  </g>

</svg>
